name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify parity
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify localization parity
        shell: pwsh
        run: ./scripts/verify-localization-parity.ps1

      - name: Verify GitHub Actions pins
        shell: pwsh
        run: ./scripts/verify-github-actions-pins.ps1

      - name: Verify release upload recovery
        shell: bash
        run: bash .github/scripts/test-upload-release-assets.sh

  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore HyperFidel/HyperFidel.csproj

      - name: Build cwASIO bridge
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msbuild = Join-Path $installation.Trim() 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          & $msbuild Native/CwAsioBridge/CwAsioBridge.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application
        run: >
          dotnet build HyperFidel/HyperFidel.csproj
          --configuration ${{ matrix.configuration }}
          --no-restore
          --warnaserror
          /p:IncludeAsioBridge=false
          /p:IncludeCwAsioBridge=true

      - name: Run unit tests
        run: |
          dotnet test HyperFidel.Core.Tests/HyperFidel.Core.Tests.csproj --configuration ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test HyperFidel.Tests/HyperFidel.Tests.csproj --configuration ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test HyperFidel.Server.Tests/HyperFidel.Server.Tests.csproj --configuration ${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows headless UI workflows
        run: >
          dotnet run --project HyperFidel.Ui.Smoke/HyperFidel.Ui.Smoke.csproj
          --configuration ${{ matrix.configuration }}
          /p:IncludeAsioBridge=false
          /p:IncludeCwAsioBridge=true

      - name: Publish Windows build
        if: matrix.configuration == 'Release'
        run: >
          dotnet publish HyperFidel/HyperFidel.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/HyperFidel-win-x64
          /p:IncludeAsioBridge=false
          /p:IncludeCwAsioBridge=true

      - name: Upload Windows build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: HyperFidel-win-x64
          path: artifacts/HyperFidel-win-x64
          if-no-files-found: error

  linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Linux desktop
        run: dotnet restore HyperFidel/HyperFidel.csproj --runtime linux-x64

      - name: Build Linux desktop
        run: >
          dotnet build HyperFidel/HyperFidel.csproj
          --configuration Release
          --no-restore
          --warnaserror

      - name: Publish Linux desktop
        run: >
          dotnet publish HyperFidel/HyperFidel.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output artifacts/HyperFidel-linux-x64

      - name: Upload Linux desktop
        uses: actions/upload-artifact@v7
        with:
          name: HyperFidel-linux-x64
          path: artifacts/HyperFidel-linux-x64
          if-no-files-found: error

  macos:
    name: Build macOS desktop ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore macOS desktop
        run: dotnet restore HyperFidel/HyperFidel.csproj --runtime ${{ matrix.rid }}

      - name: Build macOS desktop
        run: >
          dotnet build HyperFidel/HyperFidel.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          --warnaserror

      - name: Publish macOS desktop
        run: >
          dotnet publish HyperFidel/HyperFidel.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output artifacts/HyperFidel-${{ matrix.rid }}

      - name: Upload macOS desktop
        uses: actions/upload-artifact@v7
        with:
          name: HyperFidel-${{ matrix.rid }}
          path: artifacts/HyperFidel-${{ matrix.rid }}
          if-no-files-found: error
